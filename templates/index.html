<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Assistant - Copilot</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #2d3748;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .header-icon {
            font-size: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-subtitle {
            font-size: 12px;
            opacity: 0.9;
            margin-left: auto;
        }

        .content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .metrics-panel {
            width: 280px;
            padding: 20px;
            background: #f7fafc;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .metrics-panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #718096;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .metric-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid #667eea;
            transition: all 0.2s ease;
        }

        .metric-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateX(2px);
        }

        .metric-label {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .metric-value.positive {
            color: #48bb78;
        }

        .metric-value.negative {
            color: #f56565;
        }

        .metric-subtitle {
            font-size: 10px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .metrics-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #a0aec0;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.assistant .message-bubble {
            background: #edf2f7;
            color: #2d3748;
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-icon {
            font-size: 18px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .initial-message {
            text-align: center;
            color: #a0aec0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .initial-message-icon {
            font-size: 48px;
            color: #cbd5e0;
            margin-bottom: 12px;
        }

        .initial-message p {
            font-size: 14px;
            line-height: 1.6;
        }

        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e2e8f0;
            background: white;
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
        }

        .input-field {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-field::placeholder {
            color: #cbd5e0;
        }

        .send-btn {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .open-copilot-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .open-copilot-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .open-copilot-btn.show {
            display: flex;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                max-height: none;
                height: 100vh;
                border-radius: 0;
            }

            .metrics-panel {
                width: 200px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .open-copilot-btn {
                bottom: 16px;
                right: 16px;
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .metrics-panel {
                display: none;
            }

            .metric-label {
                font-size: 10px;
            }

            .metric-value {
                font-size: 16px;
            }

            .message-bubble {
                max-width: 95%;
            }
        }

        .profile-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="container" id="container" style="display: none;">
        <div class="header">
            <div class="header-icon"><i class="fas fa-lightbulb"></i></div>
            <div>
                <h1>Financial Assistant</h1>
            </div>
            <div class="header-subtitle" id="headerStatus">Cargando datos...</div>
        </div>

        <div class="content">
            <div class="metrics-panel" id="metricsPanel">
                <div class="metrics-loading">
                    <div class="spinner"></div>
                    <span>Analizando...</span>
                </div>
            </div>

            <div class="chat-panel">
                <div class="messages-container" id="messagesContainer">
                    <div class="initial-message">
                        <div class="initial-message-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <p>Bienvenido a Financial Assistant<br>Tus métricas se cargarán en un momento...</p>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            class="input-field" 
                            id="inputField" 
                            placeholder="Pregunta sobre tus finanzas..." 
                            disabled
                        >
                    </div>
                    <button class="send-btn" id="sendBtn" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button class="open-copilot-btn" id="openCopilotBtn">
        <i class="fas fa-comments"></i>
    </button>

    <script>
        // Estado global
        const state = {
            isOpen: false,
            isLoading: true,
            metrics: null,
            messages: [],
            conversationContext: {}
        };

        const elements = {
            container: document.getElementById('container'),
            modal: document.getElementById('modalOverlay'),
            metricsPanel: document.getElementById('metricsPanel'),
            messagesContainer: document.getElementById('messagesContainer'),
            inputField: document.getElementById('inputField'),
            sendBtn: document.getElementById('sendBtn'),
            openBtn: document.getElementById('openCopilotBtn'),
            headerStatus: document.getElementById('headerStatus')
        };

        // Simular análisis financiero (reemplazar con llamada real a /api/analyze)
        async function loadFinancialData() {
            return new Promise(resolve => {
                setTimeout(() => {
                    const mockData = {
                        analysis: {
                            total_income: 2500.00,
                            total_expenses: 540.38,
                            balance: 1959.62,
                            transaction_count: 12,
                            top_expense_category: 'Viajes',
                            top_expense_amount: 150.00
                        },
                        profile: {
                            profile_type: 'Ahorrador',
                            expense_ratio: 21.6,
                            actual_essentials: 123.40,
                            ideal_essentials: 1250.00,
                            actual_discretionary: 282.99,
                            ideal_discretionary: 750.00,
                            actual_savings: 1959.62,
                            ideal_savings: 500.00,
                            expense_volatility: 45.23,
                            recommendations: [
                                'Mantén tu disciplina de ahorro, vas muy bien',
                                'Considera invertir parte de tus ahorros',
                                'Tu gasto en viajes fue mayor este mes'
                            ]
                        }
                    };
                    state.metrics = mockData;
                    resolve(mockData);
                }, 1500);
            });
        }

        function renderMetrics(data) {
            const { analysis, profile } = data;
            
            const metricsHTML = `
                <h3>Resumen Financiero</h3>
                <div class="metric-card">
                    <div class="metric-label">Ingresos</div>
                    <div class="metric-value positive">+${analysis.total_income.toFixed(2)}€</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Gastos</div>
                    <div class="metric-value negative">−${analysis.total_expenses.toFixed(2)}€</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Balance</div>
                    <div class="metric-value positive">${analysis.balance.toFixed(2)}€</div>
                    <div class="metric-subtitle">Neto del período</div>
                </div>

                <h3 style="margin-top: 20px;">Tu Perfil</h3>
                <div class="metric-card">
                    <div class="metric-label">Categoría</div>
                    <div class="metric-value" style="font-size: 14px; color: #667eea;">
                        ${profile.profile_type}
                    </div>
                    <div class="profile-badge">${profile.expense_ratio.toFixed(1)}% gasto/ingreso</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mayor Gasto</div>
                    <div class="metric-value" style="font-size: 16px;">
                        ${analysis.top_expense_category}
                    </div>
                    <div class="metric-subtitle">−${analysis.top_expense_amount.toFixed(2)}€</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Volatilidad</div>
                    <div class="metric-value" style="font-size: 16px; color: #cbd5e0;">
                        ${profile.expense_volatility.toFixed(2)}€
                    </div>
                    <div class="metric-subtitle">Variabilidad de gasto</div>
                </div>
            `;
            
            elements.metricsPanel.innerHTML = metricsHTML;
        }

        function showInitialMetricsMessage(data) {
            const { analysis, profile } = data;
            
            const message = `
                <div style="color: #2d3748; line-height: 1.6;">
                    <strong>📊 Análisis de tus finanzas:</strong><br><br>
                    En este período recibiste <strong>+${analysis.total_income.toFixed(2)}€</strong> 
                    y gastaste <strong>−${analysis.total_expenses.toFixed(2)}€</strong>. 
                    Tu saldo neto es de <strong>${analysis.balance.toFixed(2)}€</strong>.<br><br>
                    Eres un <strong>${profile.profile_type}</strong>. Tu mayor gasto fue en 
                    <strong>${analysis.top_expense_category}</strong> (−${analysis.top_expense_amount.toFixed(2)}€).<br><br>
                    ${profile.recommendations.length > 0 ? 
                        '<strong>💡 Recomendaciones:</strong><br>' + 
                        profile.recommendations.map(r => '• ' + r).join('<br>')
                        : ''
                    }
                </div>
            `;
            
            addMessage('assistant', message);
            state.conversationContext = {
                profile: profile.profile_type,
                totalIncome: analysis.total_income,
                totalExpenses: analysis.total_expenses,
                balance: analysis.balance,
                topExpense: analysis.top_expense_category
            };
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const iconDiv = document.createElement('div');
            iconDiv.className = 'message-icon';
            iconDiv.innerHTML = role === 'assistant' ? '<i class="fas fa-lightbulb"></i>' : '<i class="fas fa-user"></i>';
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = content;
            
            if (role === 'assistant') {
                messageDiv.appendChild(iconDiv);
                messageDiv.appendChild(bubbleDiv);
            } else {
                messageDiv.appendChild(bubbleDiv);
                messageDiv.appendChild(iconDiv);
            }
            
            elements.messagesContainer.appendChild(messageDiv);
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
        }

        async function handleSendMessage() {
            const userInput = elements.inputField.value.trim();
            if (!userInput) return;

            elements.inputField.value = '';
            elements.sendBtn.disabled = true;

            addMessage('user', escapeHtml(userInput));

            // Simular respuesta (reemplazar con llamada real)
            setTimeout(() => {
                let response = 'Te ayudaré con tu pregunta. ';
                
                if (userInput.toLowerCase().includes('ahorro')) {
                    response += `Basándome en tu perfil de ${state.conversationContext.profile}, 
                    tu saldo actual es de ${state.conversationContext.balance.toFixed(2)}€. 
                    Te recomiendo automatizar transferencias mensuales a una cuenta de ahorro.`;
                } else if (userInput.toLowerCase().includes('gasto')) {
                    response += `Tu mayor categoría de gasto fue ${state.conversationContext.topExpense}. 
                    Intenta reducir este tipo de gastos un 15% el próximo mes.`;
                } else if (userInput.toLowerCase().includes('presupuesto')) {
                    response += `Con un ingreso de ${state.conversationContext.totalIncome.toFixed(2)}€, 
                    deberías distribuir: 50% en essenciales, 30% en ocio, 20% en ahorros.`;
                } else {
                    response += 'Puedo ayudarte con preguntas sobre tu ahorro, gastos, presupuesto o recomendaciones personalizadas.';
                }
                
                addMessage('assistant', response);
                elements.sendBtn.disabled = false;
                elements.inputField.focus();
            }, 600);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openCopilot() {
            state.isOpen = true;
            elements.container.style.display = 'flex';
            elements.modal.classList.add('show');
            elements.openBtn.classList.remove('show');
            elements.inputField.focus();
        }

        function closeCopilot() {
            state.isOpen = false;
            elements.container.style.display = 'none';
            elements.modal.classList.remove('show');
            elements.openBtn.classList.add('show');
        }

        // Event listeners
        elements.sendBtn.addEventListener('click', handleSendMessage);
        elements.inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !elements.sendBtn.disabled) {
                handleSendMessage();
            }
        });

        elements.modal.addEventListener('click', closeCopilot);
        elements.openBtn.addEventListener('click', openCopilot);

        // Inicialización
        async function initialize() {
            try {
                elements.openBtn.classList.add('show');
                const data = await loadFinancialData();
                renderMetrics(data);
                showInitialMetricsMessage(data);
                
                state.isLoading = false;
                elements.headerStatus.textContent = 'Listo';
                elements.inputField.disabled = false;
                elements.sendBtn.disabled = false;
            } catch (error) {
                console.error('Error:', error);
                addMessage('assistant', 'Error al cargar los datos financieros. Intenta más tarde.');
            }
        }

        initialize();
    </script>
</body>
</html>
