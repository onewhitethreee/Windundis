<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Assistant - Copilot</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="modal-overlay" id="modalOverlay"></div>

    <div class="modal-overlay-container" id="createGoalModalContainer">
        <div class="create-goal-modal">
            <div class="modal-header">
                <h3>Crear Nueva Meta</h3>
                <button class="close-modal-btn" id="closeGoalModalBtn" aria-label="Cerrar modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="goalTitle">Título de la meta</label>
                    <input type="text" id="goalTitle" placeholder="Ej: Fondo de emergencia" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="goalDescription">Descripción</label>
                    <textarea id="goalDescription" placeholder="Describe tu meta..." rows="3"
                        maxlength="200"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="goalTarget">Meta (€)</label>
                        <input type="number" id="goalTarget" placeholder="0" min="1" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="goalCurrent">Ahorrado actual (€)</label>
                        <input type="number" id="goalCurrent" placeholder="0" min="0" step="0.01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="goalDeadline">Plazo</label>
                        <select id="goalDeadline">
                            <option value="1 mes">1 mes</option>
                            <option value="3 meses">3 meses</option>
                            <option value="6 meses" selected>6 meses</option>
                            <option value="1 año">1 año</option>
                            <option value="2 años">2 años</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goalPriority">Prioridad</label>
                        <select id="goalPriority">
                            <option value="high">🔴 Alta</option>
                            <option value="medium" selected>🟡 Media</option>
                            <option value="low">🟢 Baja</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="goalStrategy">Estrategia</label>
                    <textarea id="goalStrategy" placeholder="¿Cómo planeas alcanzar esta meta?" rows="2"
                        maxlength="150"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" id="cancelGoalBtn">Cancelar</button>
                <button class="create-btn" id="createGoalSubmitBtn">Crear Meta</button>
            </div>
        </div>
    </div>

    <div class="container" id="container">
        <header class="header">
            <div class="header-left">
                <div class="header-icon"><i class="fas fa-target"></i></div>
                <div>
                    <h1>Financial Goals</h1>
                </div>
            </div>
            <div class="header-actions">
                <div class="header-status" id="headerStatus">Cargando...</div>
            </div>
        </header>

        <main class="content">
            <aside class="sidebar" id="sidebar">
                <section class="sidebar-section">
                    <h2 class="sidebar-title">Resumen Financiero</h2>
                    <div class="stat-card" data-action="showIncome">
                        <div class="stat-label">Ingresos</div>
                        <div class="stat-value positive" id="incomeStat">+0€</div>
                        <div class="stat-action-link">Ver desglose</div>
                    </div>
                    <div class="stat-card" data-action="showExpenses">
                        <div class="stat-label">Gastos</div>
                        <div class="stat-value negative" id="expensesStat">−0€</div>
                        <div class="stat-action-link">Ver desglose</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Balance</div>
                        <div class="stat-value" id="balanceStat">0€</div>
                    </div>
                </section>

                <section class="sidebar-section goals-section">
                    <h2 class="sidebar-title">Tus Metas</h2>
                    <button class="create-goal-btn" id="createGoalBtn">
                        <i class="fas fa-plus"></i>
                        Nueva Meta
                    </button>
                    <div id="goalsList"></div>
                </section>
            </aside>

            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-title">Chat con AI</div>
                    <button class="clear-chat-btn" id="clearChatBtn" title="Limpiar historial de chat">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="messages-container" id="messagesContainer">
                    <!-- Los mensajes se insertarán aquí dinámicamente -->
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <label for="inputField" class="visually-hidden">Pregunta sobre tus metas...</label>
                        <input type="text" class="input-field" id="inputField" placeholder="Pregunta sobre tus metas..."
                            disabled>
                    </div>
                    <button class="send-btn" id="sendBtn" disabled aria-label="Enviar mensaje">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <button class="open-copilot-btn" id="openCopilotBtn" aria-label="Abrir asistente financiero">
        <i class="fas fa-comments"></i>
    </button>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
